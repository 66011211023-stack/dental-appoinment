services:
  - type: web
    name: dental-appointment
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /health.php
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "23192"
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        value: avnadmin
      - key: DB_PASS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
