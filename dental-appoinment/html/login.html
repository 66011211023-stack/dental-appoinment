<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DentiCare HTML Preview</title>
    <link rel="stylesheet" href="../public/assets/css/browser-latest.css" />
    <link rel="stylesheet" href="../public/assets/css/php-compat.css" />
  </head>
  <body>
    <main class="auth-layout">
      <section class="auth-visual">
        <div class="auth-brand">
          <span class="brand-mark">DC</span><b>DentiCare</b>
        </div>
        <div class="visual-copy">
          <span class="pill">ระบบบริหารจัดการทันตกรรมแบบครบวงจร</span>
          <h1>ทุกการดูแล<br /><em>เริ่มต้นจากข้อมูลที่ดี</em></h1>
          <p>
            จัดการนัดหมาย ผู้ป่วย การรักษา บุคลากร
            และคลังวัสดุในพื้นที่ทำงานเดียว
          </p>
        </div>
        <small>© 2026 DentiCare Clinic Management System</small>
      </section>
      <section class="auth-panel">
        <div class="auth-card">
          <div class="auth-heading">
            <small class="eyebrow">ยินดีต้อนรับ</small>
            <h2>เข้าสู่ระบบ</h2>
            <p>กรอกข้อมูลบัญชีเพื่อเข้าสู่พื้นที่ทำงาน</p>
          </div>
          <form
            class="form-stack"
            onsubmit="
              event.preventDefault();
              location.href = 'dashboard.html';
            "
          >
            <label>ชื่อผู้ใช้หรืออีเมล<input value="admin" /></label
            ><label>รหัสผ่าน<input type="password" value="1234" /></label>
            <div class="form-row">
              <label class="check"
                ><input type="checkbox" checked /> จดจำฉัน</label
              ><a class="text-button" href="#">ลืมรหัสผ่าน?</a>
            </div>
            <button class="primary-button">เข้าสู่ระบบ →</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
